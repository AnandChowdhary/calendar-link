name: Test CI
on:
  push:
    branches-ignore:
      - master
jobs:
  release:
    name: Build and test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx npm@latest ci
      - name: Test
        run: npm test -- --runInBand
      - name: Test all-day dates in a positive-offset timezone
        run: |
          node -e 'if (Intl.DateTimeFormat().resolvedOptions().timeZone !== "Europe/Berlin") process.exit(1)'
          npm test -- --runInBand -t 'local Date midnights|non-midnight Date'
        env:
          TZ: Europe/Berlin
          CALENDAR_LINK_TEST_TZ: Europe/Berlin
      - name: Build TypeScript
        run: npm run build
